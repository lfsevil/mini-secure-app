name: Monitorización - Health Check
on:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta cada 30 minutos
  workflow_dispatch:      # Permite ejecución manual para las capturas

jobs:
  health-check:
    runs-on: self-hosted
    steps:
      - name: Comprobar disponibilidad de la URL
        run: |
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001)
          if [ "$HTTP_RESPONSE" -eq 200 ]; then
            echo "La aplicación está UP (HTTP 200)"
          else
            echo "ALERTA: La aplicación está DOWN (HTTP $HTTP_RESPONSE)"
            exit 1
          fi